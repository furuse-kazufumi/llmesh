name: Sync to gitee mirror

# v3.2 EAR-clean strategy: L1 市場 (規制対応大手企業、東アジア中心) は
# GitHub アクセスが社内ポリシーで制限されているケースが多い. gitee
# (中国国内 git host) に自動 mirror することで、これらの企業からの
# 採用障壁を除去する.
#
# Setup (1 回のみ):
# 1. gitee.com で furuse-kazufumi/llmesh ミラーリポジトリを作成
# 2. SSH 鍵を生成し公開鍵を gitee に登録
# 3. 秘密鍵を GitHub Actions secret `GITEE_SSH_KEY` に保存
# 4. gitee SSH host (gitee.com) を `GITEE_KNOWN_HOSTS` secret に保存
#    (ssh-keyscan gitee.com)
# 5. 本 workflow が自動的に push を mirror

on:
  push:
    branches: [main]
  schedule:
    # Weekly safety-net resync (UTC Sunday 18:00 ≈ Asia/Shanghai Monday 02:00)
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  mirror:
    name: Push to gitee
    runs-on: ubuntu-latest
    # Skip if secrets not configured (fork-friendly)
    if: ${{ vars.GITEE_MIRROR_ENABLED == 'true' || github.repository_owner == 'furuse-kazufumi' }}
    steps:
      - name: Checkout (mirror clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Mirror requires all refs / tags
          persist-credentials: false

      - name: Configure SSH for gitee
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.GITEE_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # gitee.com のホスト鍵を 3 種とも固定する(公開情報。help.gitee.com の
          # 「Gitee SSH 密钥指纹」と ssh-keyscan の指紋が一致することを 2026-09-27 に確認:
          # ED25519 SHA256:+ULzij2u99B9eWYFTw1Q4ErYG/aepHLbu96PAUCoV88 /
          # RSA SHA256:meTsVSCgOas8fBnJyx8EPlUJr6iQ96riFmCFPfUkDtU /
          # ECDSA SHA256:FQGC9Kn/eye1W8icdBgrQp+KkGYoFgbVr17bmjey0Wc。鍵は ssh-keyscan の
          # 実測から取り、指紋で照合した —— 要約 AI が写した鍵は 1 文字欠けていた)。
          # secret の GITEE_KNOWN_HOSTS には RSA しか無く、ssh が ED25519 を要求して
          # 2026-07-26 以降すべての同期が "No ED25519 host key is known" で落ちていた。
          cat >> ~/.ssh/known_hosts <<'EOF'
          gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN
          gitee.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMuEoYdx6to5oxR60IWj8uoe1aI0X1fKOHWOtLqTg1tsLT1iFwXV5JmFjU46EzeMBV/6EmI1uaRI6HiEPtPtJHE=
          gitee.com ssh-rsa 
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Push to gitee (mirror)
        run: |
          git remote add gitee git@gitee.com:furuse-kazufumi/llmesh.git
          git push --mirror gitee
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=yes

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
