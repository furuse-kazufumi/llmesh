name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.12 は入れられない: `requires-python = ">=3.11,<3.12"` で install 自体が
        # 失敗し、2026-06-30 以降 6 ジョブ中 3 つが赤だった。上限の理由は依存が
        # `asyncore` / `asynchat`(3.12 で標準ライブラリから削除)を使うことで、
        # 宣言を広げても通らない。宣言している範囲だけを回す。
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # `[all]` brings in optional protocol drivers (paramiko, pyftpdlib, …) so
        # `import llmesh.protocol` succeeds and the test suite can collect.
        run: pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check llmesh/

      # ★切り分けの 1 周(macOS だけ)。SMTP の統合試験は macOS でだけ
      #   「繋がるのに何も来ない」で落ちる(自前の探りが 12 回そう報告した)。
      #   港は開いているのにループが接続を受け付けていない状態で、同じログに
      #   FTP 試験(pyftpdlib の kqueue)の `OSError: [Errno 9] Bad file descriptor`
      #   が出ている。pytest はファイル名順に走るので test_ftp_adapter.py が先。
      #   **単独で通って全体で落ちるなら、原因は SMTP でなく試験間の fd 汚染**。
      #   continue-on-error: 判定材料を取るための段で、ここで CI を止めない。
      - name: SMTP integration tests in isolation (macOS diagnostic)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: python -m pytest tests/test_smtp_adapter.py tests/test_smtp_readiness_probe.py -q

      - name: Run tests with coverage
        run: python -m pytest --cov=llmesh --cov-fail-under=80 -q

      - name: Bandit security scan
        # ★`-c pyproject.toml` を必ず渡す。渡さないと pyproject.toml に理由まで
        #   書いてある skip(B104 = 文書化された opt-in の bind 設定 等)が効かず、
        #   B104 5 件で落ちる。security.yml は渡していて ci.yml は渡していなかった
        #   —— **同じ問いに答える入口が 2 つあって、片方が方針を読んでいなかった**。
        #   方針は 1 か所(pyproject.toml)にしか書かない。
        # ★PYTHONUTF8: Windows で bandit が報告のソース行(日本語)を cp1252 に
        #   書けず UnicodeEncodeError で落ちていた。検査の結果でなく文字コードで
        #   落ちる門は門ではない。
        env:
          PYTHONUTF8: "1"
        run: bandit -r llmesh/ -c pyproject.toml -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Verify dist files
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: llmesh-dist
          path: dist/*
